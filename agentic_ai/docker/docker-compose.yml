###############################################################################
# Coding Assistant Stack — Docker Compose
#
# Services:
#   llm-server   — llama-cpp-python OpenAI-compatible API (V100 GPU)
#   chromadb     — vector store for RAG
#   redis        — distributed slot queue (FIFO, works across replicas)
#   rag-api      — FastAPI: retrieval-augmented generation pipeline
#   open-webui   — ChatGPT-like browser frontend
#   nginx        — TLS termination + reverse proxy
#
# Networks:
#   backend  — internal only (llm-server, chromadb, redis, rag-api)
#   frontend — external (nginx, open-webui ↔ rag-api)
###############################################################################

name: coding-assistant

services:

  # ── LLM Server (GPU) ────────────────────────────────────────────────────────
  llm-server:
    build:
      context: .
      dockerfile: Dockerfile.llm-server
    image: coding-assistant-llm:latest
    container_name: llm-server
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # proxy (remove if not behind Intel proxy)
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
    volumes:
      - ../models:/models:ro          # GGUF model files (read-only)
      - hf_cache:/root/.cache/huggingface
    command: >
      python3 -m llama_cpp.server
      --model /models/${LLM_MODEL_FILE}
      --host 0.0.0.0
      --port 8000
      --n_gpu_layers ${LLM_GPU_LAYERS:--1}
      --n_ctx ${LLM_CONTEXT_SIZE:-8192}
      --n_batch ${LLM_BATCH_SIZE:-512}
      --n_threads 4
      --parallel ${LLM_PARALLEL_REQUESTS:-3}
      --chat_format chatml
      --interrupt_requests true
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s     # model loading takes time
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── ChromaDB Vector Store ────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: chromadb
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_SERVER_AUTH_CREDENTIALS: ${CHROMA_TOKEN}
      CHROMA_SERVER_AUTH_PROVIDER: "chromadb.auth.token_authn.TokenAuthenticationServerProvider"
      CHROMA_SERVER_AUTH_TOKEN_TRANSPORT_HEADER: "Authorization"
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis — distributed LLM slot queue ────────────────────────────────────────
  # Replaces asyncio.Semaphore so the slot limit is enforced even when multiple
  # rag-api replicas are running (horizontal scaling). Uses BLPOP/RPUSH as a
  # FIFO token-bucket queue — no Lua scripts, no polling, atomic by design.
  redis:
    image: redis:7-alpine
    container_name: redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --loglevel notice
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── RAG API ──────────────────────────────────────────────────────────────────
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile.rag-api
    image: coding-assistant-api:latest
    container_name: rag-api
    env_file: ../config/.env
    environment:
      LLM_SERVER_URL: http://llm-server:8000
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: "8000"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - enterprise_data:/app/data        # enterprise docs (PDFs, txt, etc.)
      - ../src/rag_api:/app              # live-reload friendly in dev
    # With Redis queuing, multiple workers ARE now safe — each worker shares
    # the same Redis-backed slot pool, so slot limits are enforced globally.
    # Keep workers=1 for simplicity (single server, single V100). Scale up
    # by increasing this only if you add more hardware.
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8080
      --workers 1
      --log-level info
    networks:
      - backend
      - frontend
    depends_on:
      llm-server:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Open WebUI (browser frontend) ────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.5.20
    container_name: open-webui
    environment:
      # Point to our RAG API (OpenAI-compatible)
      OPENAI_API_BASE_URL: http://rag-api:8080/v1
      OPENAI_API_KEY: ${RAG_API_KEY}
      # Disable built-in Ollama (we use our own LLM)
      OLLAMA_BASE_URL: ""
      ENABLE_OLLAMA_API: "false"
      # Security
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: "true"
      # Disable telemetry
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - frontend
    depends_on:
      rag-api:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx TLS Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend
    depends_on:
      - open-webui
    restart: unless-stopped

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
    internal: true          # NO external routing — LLM and ChromaDB are isolated
    ipam:
      config:
        - subnet: 172.20.0.0/24

  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  chromadb_data:
    driver: local
  redis_data:
    driver: local
  hf_cache:
    driver: local
  enterprise_data:
    driver: local
  open_webui_data:
    driver: local
