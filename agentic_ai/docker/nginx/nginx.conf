###############################################################################
# Nginx — TLS reverse proxy for the coding assistant stack
#
# Exposes:
#   :80  → redirect to HTTPS
#   :443 → Open WebUI (browser UI)
#          /api/* → RAG API (for direct API access from tools)
#
# Security:
#   TLS 1.2/1.3 only, strong cipher suite
#   HSTS, X-Frame-Options, X-Content-Type-Options
#   Rate limiting on /api/* and login endpoint
#   Connection to backends over internal Docker network (no TLS needed)
###############################################################################

worker_processes auto;
worker_rlimit_nofile 65536;   # allow many open file descriptors for concurrent users
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;   # increased from 1024 for multi-user
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100m;   # allow large file uploads for ingestion

    # ── Rate Limiting ──────────────────────────────────────────────────────────
    # Key: hash of Authorization header so each user gets their own bucket.
    # Falls back to IP if no auth header is present.
    map $http_authorization $rate_limit_key {
        default          $binary_remote_addr;   # unauthenticated: limit by IP
        ~^Bearer\s+(.+)$ $1;                    # authenticated: limit by token
    }

    # API: 20 req/s per user, burst of 40 (accommodates streaming heartbeats)
    limit_req_zone  $rate_limit_key zone=api_limit:20m  rate=20r/s;
    # Auth: 3 req/s per IP (brute-force protection)
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=3r/s;
    # Concurrent open connections per IP (prevents connection exhaustion)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream backends ─────────────────────────────────────────────────────
    upstream open_webui {
        server open-webui:8080;
        keepalive 32;   # persistent connections for multiple concurrent users
    }

    upstream rag_api {
        server rag-api:8080;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS main server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # ── TLS ───────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Security headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Direct API access (for curl / IDE plugins) ────────────────────────
        location /api/ {
            limit_req  zone=api_limit burst=40 nodelay;
            limit_conn conn_limit 20;   # max 20 simultaneous connections per IP

            # Strip /api prefix before forwarding
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://rag_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming support (for token-by-token LLM responses)
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── Login rate limit ──────────────────────────────────────────────────
        location /auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://open_webui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Open WebUI (everything else) ──────────────────────────────────────
        location / {
            limit_req  zone=api_limit burst=100 nodelay;
            limit_conn conn_limit 30;   # max 30 open connections per IP (tabs, SSE streams)

            proxy_pass http://open_webui;
            proxy_http_version 1.1;
            # WebSocket support (Open WebUI uses SSE/WS for streaming)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming support
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
